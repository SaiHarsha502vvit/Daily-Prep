      - name: Install Playwright browsers
        working-directory: 21_SDET_Playwright_Automation/framework
        run: npx playwright install --with-deps

      - name: Run a11y tests
        working-directory: 21_SDET_Playwright_Automation/framework
        env:
          CI: true
