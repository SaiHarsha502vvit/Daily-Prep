        run: npx playwright test --grep '@a11y'

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: 21_SDET_Playwright_Automation/framework/playwright-report/
          retention-days: 7

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 21_SDET_Playwright_Automation/framework/package-lock.json

      - name: Install dependencies
        working-directory: 21_SDET_Playwright_Automation/framework
