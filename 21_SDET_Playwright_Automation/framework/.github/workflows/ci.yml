name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: '18'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 21_SDET_Playwright_Automation/framework/package-lock.json

      - name: Install dependencies
        working-directory: 21_SDET_Playwright_Automation/framework
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('21_SDET_Playwright_Automation/framework/package-lock.json') }}

      - name: Lint
        working-directory: 21_SDET_Playwright_Automation/framework
        run: npm run lint

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 21_SDET_Playwright_Automation/framework/package-lock.json

      - name: Install dependencies
        working-directory: 21_SDET_Playwright_Automation/framework
        run: npm ci

      - name: TypeScript check
        working-directory: 21_SDET_Playwright_Automation/framework
        run: npm run typecheck

  test:
    name: Test (${{ matrix.os }} · Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ${{ matrix.os }}
    needs: [lint, typecheck]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shardIndex: [1, 2, 3]
        shardTotal: [3]
        # Reproducibility cost grows with parallelism — keep the matrix lean by
        # running full sharding on Ubuntu (cheapest minutes) and one shard on
        # macOS / Windows as a cross-platform smoke gate.
        exclude:
          - os: macos-latest
            shardIndex: 2
          - os: macos-latest
            shardIndex: 3
          - os: windows-latest
            shardIndex: 2
          - os: windows-latest
            shardIndex: 3
    env:
      PLAYWRIGHT_SHARD_INDEX: ${{ matrix.shardIndex }}
      PLAYWRIGHT_SHARD_TOTAL: ${{ matrix.shardTotal }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 21_SDET_Playwright_Automation/framework/package-lock.json

      - name: Install dependencies
        working-directory: 21_SDET_Playwright_Automation/framework
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('21_SDET_Playwright_Automation/framework/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: 21_SDET_Playwright_Automation/framework
        run: npx playwright install --with-deps

      - name: Run tests
        working-directory: 21_SDET_Playwright_Automation/framework
        env:
          CI: true
          ENV_FILE: .env.ci
        # Use the `blob` reporter on sharded runs so the merge-reports job
        # can stitch them back into one HTML report via `playwright merge-reports`.
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=blob

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # OS in the artifact name so cross-platform matrix jobs with the
          # same shard number don't collide.
          name: blob-report-${{ matrix.os }}-shard-${{ matrix.shardIndex }}
          path: 21_SDET_Playwright_Automation/framework/blob-report/
          retention-days: 14

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trace-${{ matrix.os }}-shard-${{ matrix.shardIndex }}
          path: 21_SDET_Playwright_Automation/framework/test-results/
          retention-days: 14

  merge-reports:
    name: Merge Reports
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 21_SDET_Playwright_Automation/framework/package-lock.json

      - name: Install dependencies (needed for playwright merge-reports)
        working-directory: 21_SDET_Playwright_Automation/framework
        run: npm ci

      - name: Download all blob reports (Ubuntu shards only — primary matrix)
        uses: actions/download-artifact@v4
        with:
          # Only Ubuntu carries the full shard fan-out; macOS/Windows are
          # cross-platform smoke gates with single shards each. Merge the
          # primary Ubuntu sequence into a single HTML report.
          pattern: blob-report-ubuntu-latest-shard-*
          path: 21_SDET_Playwright_Automation/framework/all-blob-reports
          merge-multiple: true

      - name: Merge into HTML report
        working-directory: 21_SDET_Playwright_Automation/framework
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: 21_SDET_Playwright_Automation/framework/playwright-report/
          retention-days: 30