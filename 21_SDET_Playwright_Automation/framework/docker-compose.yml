---
# ============================================================
# Playwright Enterprise Framework — Docker Compose
# ============================================================
# Services:
#   playwright  — the test runner (built from ./Dockerfile)
#
# Usage:
#   Build:              docker compose build
#   Run all tests:      docker compose run --rm playwright
#   Single project:     docker compose run --rm playwright npx playwright test --project=api
#   Shard 1 of 4:       docker compose run --rm -e PLAYWRIGHT_SHARD_INDEX=1 -e PLAYWRIGHT_SHARD_TOTAL=4 playwright
#   View report:        docker compose run --rm playwright npx playwright show-report playwright-report
#   Tear down:          docker compose down --volumes
# ============================================================
# Note: the `version:` field is deliberately omitted — Compose v2+
# treats it as informational only and emits a deprecation warning.
# ============================================================

services:
  # ── Playwright test runner ─────────────────────────────────
  playwright:
    build:
      context: .
      dockerfile: Dockerfile
    image: playwright-framework:latest

    # Shared memory: Chromium and Firefox need > 64 MB /dev/shm.
    # 2 GB is safe for 4 parallel workers.
    shm_size: "2gb"

    environment:
      # CI mode: forbidOnly, 4 workers, 2 retries (playwright.config.ts)
      CI: "true"

      # Application URLs — read by framework/config/env.loader.ts
      ORANGEHRM_BASE_URL: ${ORANGEHRM_BASE_URL:-https://opensource-demo.orangehrmlive.com}
      API_BASE_URL: ${API_BASE_URL:-https://reqres.in}

      # Auth credentials — inject from your CI secrets manager.
      # NEVER hardcode credentials here; use environment variable substitution.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ORANGEHRM_DEMO_USERNAME: ${ORANGEHRM_DEMO_USERNAME:-Admin}
      ORANGEHRM_DEMO_PASSWORD: ${ORANGEHRM_DEMO_PASSWORD:-admin123}

      # Workers / retries overrides
      PLAYWRIGHT_WORKERS: ${PLAYWRIGHT_WORKERS:-4}
      PLAYWRIGHT_RETRIES: ${PLAYWRIGHT_RETRIES:-2}

      # Sharding overrides (used by playwright.config.ts)
      PLAYWRIGHT_SHARD_INDEX: ${PLAYWRIGHT_SHARD_INDEX:-}
      PLAYWRIGHT_SHARD_TOTAL: ${PLAYWRIGHT_SHARD_TOTAL:-}

      # Optional OAuth settings
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL:-}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}

    volumes:
      # Mount test artifacts OUT of the container so CI can collect them.
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
      - traces:/app/test-results/traces
      - ./logs:/app/logs

    # Default command: run all tests.
    # Override at run-time for specific projects, shards, etc.
    command: []

volumes:
  traces:
    driver: local

networks:
  default:
    name: playwright-net
