<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Challenge 1: Vanilla JS DOM Sync</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #1a1a2e;
        color: #e0e0e0;
        padding: 2rem;
      }
      .container {
        max-width: 500px;
        margin: 0 auto;
      }
      h3 {
        margin-bottom: 1rem;
        color: #00d2ff;
      }
      input,
      button {
        padding: 0.5rem 1rem;
        margin: 0.25rem;
        border: 1px solid #333;
        border-radius: 4px;
        font-size: 1rem;
      }
      input {
        background: #16213e;
        color: #e0e0e0;
        width: 200px;
      }
      button {
        background: #0f3460;
        color: #e0e0e0;
        cursor: pointer;
      }
      button:hover {
        background: #1a5276;
      }
      ul {
        list-style: none;
        margin-top: 1rem;
      }
      li {
        padding: 0.5rem;
        margin: 0.25rem 0;
        background: #16213e;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      li button {
        background: #c0392b;
        padding: 0.25rem 0.75rem;
        font-size: 0.85rem;
      }
      li button:hover {
        background: #e74c3c;
      }
      .count {
        margin-top: 1rem;
        color: #888;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h3>Employee Roster</h3>
      <input type="text" id="nameInput" placeholder="Enter employee name" />
      <button id="addBtn">Add Employee</button>
      <button id="sortBtn">Sort A-Z</button>

      <ul id="employeeList">
        <!-- Employees go here -->
      </ul>
      <p class="count" id="countDisplay">Employees: 0</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
